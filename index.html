<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guhan's Chore Tracker</title>
    <style>
        :root { 
            --primary: #4f46e5; 
            --accent: #0ea5e9;
            --danger: #f43f5e; 
            --success: #10b981; 
            --bg: #eef2ff; 
            --card-bg: #ffffff;
            --text-dark: #1e1b4b;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 1.5rem; color: var(--text-dark); 
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* HEADER WITH LOGO */
        header { 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem; 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; padding: 2rem; border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            position: relative;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .header-title {
            margin: 0; 
            font-size: 2rem; 
            letter-spacing: -1px;
            font-weight: 800;
        }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .pot-display { text-align: center; padding: 1rem; border-radius: 12px; background: #f0fdf4; border: 2px solid #bbf7d0; }
        .pot-value { font-size: 3.5rem; font-weight: 800; color: var(--success); margin: 0; }
        
        .task-item { display: flex; align-items: center; gap: 12px; padding: 1rem; margin-bottom: 8px; border-radius: 10px; background: #f8fafc; border-left: 4px solid var(--accent); }
        .task-name { flex-grow: 1; font-weight: 600; }

        .parent-only { display: none; }
        .parent-active .parent-only { display: block; }
        .parent-zone { background: #fffbeb; border: 2px dashed #fcd34d; padding: 1rem; border-radius: 12px; margin-top: 1rem; }
        
        .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-lock { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(5px); }
        .btn-lock.active { background: var(--danger); }

        .streak-badge { background: #fbbf24; color: #78350f; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; }
        .history-list { max-height: 250px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    </style>
</head>
<body id="bodyTag">

<div class="container">
    <header>
        <div class="profile-container">
            <img src="guhanprofile.JPG" alt="Guhan" class="profile-pic">
            <h1 class="header-title">Guhan's Chore & Allowance</h1>
        </div>
        <p id="todayDate" style="opacity: 0.9; margin: 0; font-weight: 500;"></p>
        <button id="lockBtn" class="btn btn-lock" onclick="toggleParentMode()" style="margin-top:20px">Unlock Parent Mode</button>
    </header>
    
    <div class="dashboard">
        <div class="card">
            <h3 style="margin-top:0; color: var(--primary)">Current Pot</h3>
            <div class="pot-display">
                <div id="allowancePot" class="pot-value">$150.00</div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <span class="streak-badge">🔥 <span id="streakCount">0</span> DAY STREAK</span>
            </div>
            
            <div class="parent-only parent-zone">
                <p style="margin: 0 0 8px 0; font-size: 0.8rem; font-weight: bold;">Manual Adjustment:</p>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="adjAmt" placeholder="$" style="width:80px; padding:8px; border-radius:6px; border:1px solid #ccc">
                    <button class="btn" onclick="manualAdjust(true)" style="background:var(--success); color:white">+</button>
                    <button class="btn" onclick="manualAdjust(false)" style="background:var(--danger); color:white">-</button>
                </div>
            </div>
        </div>
        
        <div class="card parent-only" style="border: 2px solid var(--primary);">
            <h3 style="margin-top:0; color: var(--primary)">Assign New Chore</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="text" id="taskName" placeholder="Task Name..." style="padding:12px; border-radius:8px; border:1px solid #ddd">
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 0.8rem;">
                    <label><input type="checkbox" class="day-check" value="1" checked> M</label>
                    <label><input type="checkbox" class="day-check" value="2" checked> T</label>
                    <label><input type="checkbox" class="day-check" value="3" checked> W</label>
                    <label><input type="checkbox" class="day-check" value="4" checked> T</label>
                    <label><input type="checkbox" class="day-check" value="5" checked> F</label>
                    <label><input type="checkbox" class="day-check" value="6"> S</label>
                    <label><input type="checkbox" class="day-check" value="0"> S</label>
                </div>
                <button class="btn btn-primary" onclick="addTask()">Save Chore</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3 style="margin-top:0; color: var(--accent)">Today's Goals</h3>
            <div id="taskList"></div>
        </div>
        <div class="card">
            <h3 style="margin-top:0; color: #64748b">Activity Log</h3>
            <div id="historyLog" class="history-list"></div>
        </div>
    </div>
</div>

<script>
    const PIN_HASH = "f9876e6d302344799042c069bc43f1146746816e8851493f140026e6414a3ec4"; 

    let state = JSON.parse(localStorage.getItem('guhanChore_v1')) || {
        pot: 150, streak: 0, tasks: [], history: [], lastCheck: new Date().toLocaleDateString(), completedToday: [], waivedToday: []
    };

    async function toggleParentMode() {
        if (document.body.classList.contains('parent-active')) {
            document.body.classList.remove('parent-active');
            document.getElementById('lockBtn').innerText = "Unlock Parent Mode";
            document.getElementById('lockBtn').classList.remove('active');
        } else {
            const pass = prompt("Enter Parent Password:");
            if (!pass) return;
            const msgUint8 = new TextEncoder().encode(pass);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            if (hashHex === PIN_HASH) {
                document.body.classList.add('parent-active');
                document.getElementById('lockBtn').innerText = "Lock Parent Mode";
                document.getElementById('lockBtn').classList.add('active');
            } else { alert("Wrong Password"); }
        }
    }

    function addTask() {
        const input = document.getElementById('taskName');
        const days = Array.from(document.querySelectorAll('.day-check:checked')).map(i => parseInt(i.value));
        if (!input.value) return;
        state.tasks.push({ id: Date.now(), name: input.value, days });
        input.value = '';
        saveAndRender();
    }

    function toggleTask(taskId) {
        const idx = state.completedToday.indexOf(taskId);
        if (idx > -1) state.completedToday.splice(idx, 1);
        else state.completedToday.push(taskId);
        saveAndRender();
    }

    function waiveTask(taskId, name) {
        state.waivedToday.push(taskId);
        state.history.unshift({ date: "OVERRIDE", msg: `Waived: ${name}`, amt: "—", class: "" });
        saveAndRender();
    }

    function manualAdjust(isAdd) {
        const input = document.getElementById('adjAmt');
        const amt = parseFloat(input.value);
        if (isNaN(amt)) return;
        state.pot = isAdd ? state.pot + amt : state.pot - amt;
        state.history.unshift({ date: "Manual", msg: "Parent Adjustment", amt: (isAdd ? "+" : "-") + "$" + amt.toFixed(2), class: isAdd ? "amt-pos" : "amt-neg" });
        input.value = '';
        saveAndRender();
    }

    function checkDailyLogic() {
        const today = new Date().toLocaleDateString();
        if (state.lastCheck !== today) {
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yDay = yesterday.getDay();
            const yTasks = state.tasks.filter(t => t.days.includes(yDay));
            if (yTasks.length > 0) {
                const finished = yTasks.filter(t => state.completedToday.includes(t.id) || state.waivedToday.includes(t.id));
                if (finished.length === yTasks.length) {
                    state.streak++;
                    if (state.streak % 5 === 0) {
                        state.pot += 5;
                        state.history.unshift({ date: "Bonus", msg: "5-Day Streak reached!", amt: "+$5.00", class: "amt-pos" });
                    }
                } else {
                    state.pot -= 5;
                    state.streak = 0;
                    state.history.unshift({ date: "Deduction", msg: "Missed Daily Chores", amt: "-$5.00", class: "amt-neg" });
                }
            }
            state.completedToday = []; state.waivedToday = []; state.lastCheck = today;
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('guhanChore_v1', JSON.stringify(state));
        document.getElementById('allowancePot').innerText = `$${state.pot.toFixed(2)}`;
        document.getElementById('streakCount').innerText = state.streak;
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        const todayNum = new Date().getDay();
        state.tasks.filter(t => t.days.includes(todayNum)).forEach(task => {
            const isDone = state.completedToday.includes(task.id);
            const isWaived = state.waivedToday.includes(task.id);
            list.innerHTML += `
                <div class="task-item">
                    <input type="checkbox" ${isDone || isWaived ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <span class="task-name" style="${isDone || isWaived ? 'text-decoration:line-through;color:#94a3b8' : ''}">${task.name} ${isWaived ? '<b>(Waived)</b>' : ''}</span>
                    <button class="parent-only btn btn-waive" onclick="waiveTask(${task.id}, '${task.name}')">Waive</button>
                </div>`;
        });
        const histDiv = document.getElementById('historyLog');
        histDiv.innerHTML = state.history.slice(0, 20).map(h => `
            <div class="history-item">
                <span style="font-weight:bold; color:#94a3b8">${h.date}</span>
                <span style="flex-grow:1; margin-left:15px">${h.msg}</span>
                <span class="${h.class || ''}">${h.amt}</span>
            </div>`).join('');
    }
    checkDailyLogic();
    saveAndRender();
</script>
</body>
</html>
