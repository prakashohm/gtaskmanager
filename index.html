<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guhan's Chore Tracker (Sync)</title>
    <style>
        :root { 
            --primary: #4f46e5; --accent: #0ea5e9; --danger: #f43f5e; 
            --success: #10b981; --bg: #eef2ff; --card-bg: #ffffff; --text-dark: #1e1b4b;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 1.5rem; color: var(--text-dark); }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { 
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 2rem; background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; padding: 2rem; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
        }

        .profile-container { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .profile-pic { 
            width: 90px; height: 90px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.4);
            object-fit: cover; background: #e2e8f0;
        }

        .header-title { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .pot-display { text-align: center; padding: 1rem; border-radius: 12px; background: #f0fdf4; border: 2px solid #bbf7d0; }
        .pot-value { font-size: 3.5rem; font-weight: 800; color: var(--success); margin: 0; }
        
        .task-item { display: flex; align-items: center; gap: 12px; padding: 1rem; margin-bottom: 8px; border-radius: 10px; background: #f8fafc; border-left: 4px solid var(--accent); }
        .task-name { flex-grow: 1; font-weight: 600; }

        .parent-only { display: none !important; }
        .parent-active .parent-only { display: block !important; }
        .parent-zone { background: #fffbeb; border: 2px dashed #fcd34d; padding: 1.2rem; border-radius: 12px; margin-top: 1rem; }
        
        .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-lock { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(5px); }
        .btn-lock.active { background: var(--danger); }
        .btn-waive { background: #fef3c7; color: #92400e; font-size: 0.75rem; }

        .streak-badge { background: #fbbf24; color: #78350f; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; }
        .history-list { max-height: 250px; overflow-y: auto; font-size: 0.9rem; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body id="bodyTag">

<div class="container">
    <header>
        <div class="profile-container">
            <img src="profile.jpg" alt="Guhan" class="profile-pic" onerror="this.src='https://ui-avatars.com/api/?name=Guhan&background=random'">
            <h1 class="header-title">Guhan's Chores</h1>
        </div>
        <p id="todayDate" style="opacity: 0.9; margin: 0; font-weight: 500;"></p>
        <button id="lockBtn" class="btn btn-lock" onclick="toggleParentMode()" style="margin-top:20px">Unlock Parent Mode</button>
    </header>
    
    <div class="dashboard">
        <div class="card">
            <h3 style="margin-top:0; color: var(--primary)">Allowance Pot</h3>
            <div class="pot-display">
                <div id="allowancePot" class="pot-value">...</div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <span class="streak-badge">🔥 <span id="streakCount">0</span> DAY STREAK</span>
            </div>
            
            <div class="parent-only parent-zone">
                <p style="margin: 0 0 8px 0; font-size: 0.8rem; font-weight: bold;">Manual Adjustment:</p>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="adjAmt" placeholder="$" style="width:80px; padding:8px; border-radius:6px; border:1px solid #ccc">
                    <button class="btn" onclick="manualAdjust(true)" style="background:var(--success); color:white">+</button>
                    <button class="btn" onclick="manualAdjust(false)" style="background:var(--danger); color:white">-</button>
                </div>
            </div>
        </div>
        
        <div class="card parent-only" style="border: 2px solid var(--primary); background: #f5f3ff;">
            <h3 style="margin-top:0; color: var(--primary)">Assign New Chore</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="text" id="taskName" placeholder="Task description..." style="padding:12px; border-radius:8px; border:1px solid #ddd">
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 0.8rem;">
                    <label><input type="checkbox" class="day-check" value="1" checked> M</label>
                    <label><input type="checkbox" class="day-check" value="2" checked> T</label>
                    <label><input type="checkbox" class="day-check" value="3" checked> W</label>
                    <label><input type="checkbox" class="day-check" value="4" checked> T</label>
                    <label><input type="checkbox" class="day-check" value="5" checked> F</label>
                    <label><input type="checkbox" class="day-check" value="6"> S</label>
                    <label><input type="checkbox" class="day-check" value="0"> S</label>
                </div>
                <button class="btn btn-primary" onclick="addTask()">Save Chore</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3 style="margin-top:0; color: var(--accent)">Today's Goals</h3>
            <div id="taskList">Loading chores...</div>
        </div>
        <div class="card">
            <h3 style="margin-top:0; color: #64748b">Activity Log</h3>
            <div id="historyLog" class="history-list"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // --- 1. CONFIGURATION ---
    const SUPABASE_URL = "https://urfpiauvuusibgzeyjjf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pt2FCjNMufUil0txOXXSaw_KgY7kcyr";
    const PARENT_PASS = "Admin123+";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = {
        pot: 150, streak: 0, tasks: [], history: [], 
        lastCheck: new Date().toLocaleDateString(), 
        completedToday: [], waivedToday: []
    };

    // --- 2. DATA SYNC ---
    async function loadCloudData() {
        const { data, error } = await supabase
            .from('chore_app_state')
            .select('app_data')
            .eq('app_name', 'GuhanApp')
            .single();
        
        if (data && data.app_data && Object.keys(data.app_data).length > 0) {
            state = data.app_data;
        }
        checkDailyLogic();
        renderUI();
    }

    async function syncToCloud() {
        const { error } = await supabase
            .from('chore_app_state')
            .update({ app_data: state })
            .eq('app_name', 'GuhanApp');
        if (error) console.error("Cloud Error:", error);
    }

    // --- 3. CORE LOGIC ---
    function checkDailyLogic() {
        const today = new Date().toLocaleDateString();
        if (state.lastCheck !== today) {
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yDay = yesterday.getDay();
            const yTasks = state.tasks.filter(t => t.days.includes(yDay));
            
            if (yTasks.length > 0) {
                const finished = yTasks.filter(t => state.completedToday.includes(t.id) || state.waivedToday.includes(t.id));
                if (finished.length === yTasks.length) {
                    state.streak++;
                    if (state.streak > 0 && state.streak % 5 === 0) {
                        state.pot += 5;
                        state.history.unshift({ date: "BONUS", msg: "5-Day Streak!", amt: "+$5.00", class: "amt-pos" });
                    }
                } else {
                    state.pot -= 5;
                    state.streak = 0;
                    state.history.unshift({ date: "DAILY", msg: "Missed Chores", amt: "-$5.00", class: "amt-neg" });
                }
            }
            state.completedToday = []; state.waivedToday = []; state.lastCheck = today;
        }
    }

    // --- 4. UI ACTIONS ---
    function toggleParentMode() {
        if (document.body.classList.contains('parent-active')) {
            document.body.classList.remove('parent-active');
            document.getElementById('lockBtn').innerText = "Unlock Parent Mode";
            document.getElementById('lockBtn').classList.remove('active');
        } else {
            const pass = prompt("Enter Parent Password:");
            if (pass === PARENT_PASS) {
                document.body.classList.add('parent-active');
                document.getElementById('lockBtn').innerText = "Lock Parent Mode";
                document.getElementById('lockBtn').classList.add('active');
            } else if (pass !== null) { alert("Incorrect!"); }
        }
    }

    async function addTask() {
        const name = document.getElementById('taskName').value;
        const days = Array.from(document.querySelectorAll('.day-check:checked')).map(i => parseInt(i.value));
        if (!name) return;
        state.tasks.push({ id: Date.now(), name, days });
        document.getElementById('taskName').value = '';
        await saveAction();
    }

    async function toggleTask(taskId) {
        const idx = state.completedToday.indexOf(taskId);
        if (idx > -1) state.completedToday.splice(idx, 1);
        else state.completedToday.push(taskId);
        await saveAction();
    }

    async function waiveTask(taskId, name) {
        state.waivedToday.push(taskId);
        state.history.unshift({ date: "WAIVE", msg: name, amt: "—", class: "" });
        await saveAction();
    }

    async function manualAdjust(isAdd) {
        const val = parseFloat(document.getElementById('adjAmt').value);
        if (isNaN(val)) return;
        state.pot = isAdd ? state.pot + val : state.pot - val;
        state.history.unshift({ date: "MANUAL", msg: "Adjustment", amt: (isAdd ? "+" : "-") + "$" + val.toFixed(2), class: isAdd ? "amt-pos" : "amt-neg" });
        document.getElementById('adjAmt').value = '';
        await saveAction();
    }

    async function saveAction() {
        renderUI();
        await syncToCloud();
    }

    function renderUI() {
        document.getElementById('allowancePot').innerText = `$${state.pot.toFixed(2)}`;
        document.getElementById('streakCount').innerText = state.streak;
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        const todayNum = new Date().getDay();
        state.tasks.filter(t => t.days.includes(todayNum)).forEach(task => {
            const isDone = state.completedToday.includes(task.id);
            const isWaived = state.waivedToday.includes(task.id);
            list.innerHTML += `
                <div class="task-item">
                    <input type="checkbox" ${isDone || isWaived ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <span class="task-name" style="${isDone || isWaived ? 'text-decoration:line-through;color:#94a3b8' : ''}">${task.name} ${isWaived ? '<b>(Waived)</b>' : ''}</span>
                    <div class="parent-only" style="display:flex; gap:5px;">
                        <button class="btn btn-waive" onclick="waiveTask(${task.id}, '${task.name}')">Waive</button>
                        <button class="btn" style="background:#fee2e2;color:#991b1b;padding:5px;font-size:0.7rem" onclick="state.tasks=state.tasks.filter(t=>t.id!=${task.id});saveAction()">Del</button>
                    </div>
                </div>`;
        });
        if(list.innerHTML === '') list.innerHTML = "<p style='text-align:center;color:#94a3b8'>No chores for today!</p>";

        const histDiv = document.getElementById('historyLog');
        histDiv.innerHTML = state.history.slice(0, 15).map(h => `
            <div class="history-item">
                <span style="font-weight:bold; color:#94a3b8; font-size:0.7rem">${h.date}</span>
                <span style="flex-grow:1; margin-left:10px">${h.msg}</span>
                <span class="${h.class || ''}">${h.amt}</span>
            </div>`).join('');
    }

    // Startup
    loadCloudData();
</script>
</body>
</html>
